
dataset: agiqa-3k
label_name: mos_quality # mos_quality, mos_align
language_model: openbmb/MiniCPM-Llama3-V-2_5
max_epochs: 20  # 40 epochs for 0.00001 lr; 10 epochs for 0.00002.
pretrained: true
freeze_backbone: true
lr: 0.00001
batch_size: 1 # batch_size should be 1 or taking too much vram
num_workers: 2
model: minicpm-xlstm
train_ratio: 0.8
val_ratio: 0.2
gpu: '[0]'
optimizer: 'adamw' 
precision: '16-mixed'

train_data: 712_splits/train.csv
val_data: 712_splits/val.csv
test_data: 712_splits/test.csv

pretrained_checkpoint: 'strawhat/minicpm2.5-agiqa-3k-ft'
data_path: '/data_processed/agiqa-3k/gemini1.5pro_quality_train.json' # q
eval_data_path: '/data_processed/agiqa-3k/gemini1.5pro_quality_val.json'
test_data_path: '/data_processed/agiqa-3k/gemini1.5pro-cpm2.5-q-res.json'


# gemini1.5p on minicpm a
# data_path: '/data_processed/agiqa-3k/gemini1.5pro_align_train.json' # a
# eval_data_path: '/data_processed/agiqa-3k/gemini1.5pro_align_val.json'
# test_data_path: '/data_processed/agiqa-3k/gemini1.5pro-cpm2.5-a-res.json'

model_max_length: 512
max_slice_nums: 9
llm_type: 'llama3'
patch_size: 14
query_nums: 96  # from minicpmv2.5's config
pooler: mean
